<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIH7 LinkedIn Team Posts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mada:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HIH7 — LinkedIn team post, rebuilt from the original Canva
   design (same background, lockups and layout), 1600 × 962.
============================================================ */
:root { --lilac: #a985ff; --lavender: #c4b0ff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0238; font-family: "Mada", sans-serif; padding: 40px; display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; }

.post { width: 1600px; height: 962px; position: relative; overflow: hidden; color: #fff;
  background: #0d0550 url(assets/bg.jpg) center / cover no-repeat; }
.post > * { position: absolute; }

.lattice { left: 0; top: 0; width: 1600px; height: 962px; }
.mark { left: 173px; top: 73px; width: 116px; }
.wordmark { left: 110px; top: 226px; width: 219px; }

.t { left: 90px; white-space: nowrap; line-height: 1; }
.h1 { top: 368px; font-weight: 700; color: transparent;
  background: linear-gradient(90deg, #c7b0ff 0%, #a07aff 55%, #8c5cff 100%); -webkit-background-clip: text; background-clip: text; }
.h2 { top: 496px; font-weight: 700; }
.p1 { top: 562px; font-weight: 600; color: var(--lilac); }
.p2 { top: 611px; font-weight: 600; color: var(--lilac); }
.p3 { top: 680px; font-weight: 700; }
.p4 { top: 727px; font-weight: 700; }

/* portrait */
.glow { left: 1000px; top: 560px; width: 580px; opacity: .95; }
.photo { left: 1066px; top: 262px; width: 432px; height: 470px; display: flex; align-items: flex-end; justify-content: center;
  -webkit-mask-image: linear-gradient(180deg, #000 72%, transparent 100%); mask-image: linear-gradient(180deg, #000 72%, transparent 100%); }
.photo img { max-width: 100%; max-height: 100%; object-fit: contain; object-position: bottom; }
.photo svg { width: 432px; height: 470px; }

.plate { left: 1063px; top: 722px; width: 431px; height: 83px; background: rgba(36, 18, 120, .62); border-left: 8px solid #9a72ff; }
.plate .name { position: absolute; left: 28px; top: 10px; font-size: 30px; font-weight: 700; line-height: 1; }
.plate .role { position: absolute; right: 100px; top: 47px; font-size: 25px; font-weight: 600; color: var(--lavender); line-height: 1; white-space: nowrap; }

.hosts { left: 1460px; top: 880px; width: 118px; }
.rule { left: 0; top: 943px; width: 1434px; height: 1px; background: rgba(255, 255, 255, .55); }
</style>
</head>
<body>

<template id="tpl">
  <section class="post">
    <svg class="lattice" viewBox="0 0 1600 962" aria-hidden="true"><defs><linearGradient id="lf" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><g stroke="url(#lf)" stroke-width="1"><line x1="544" y1="0" x2="1064" y2="600"/><line x1="1064" y1="0" x2="544" y2="600"/><line x1="590" y1="0" x2="1110" y2="600"/><line x1="1110" y1="0" x2="590" y2="600"/><line x1="636" y1="0" x2="1156" y2="600"/><line x1="1156" y1="0" x2="636" y2="600"/><line x1="682" y1="0" x2="1202" y2="600"/><line x1="1202" y1="0" x2="682" y2="600"/><line x1="728" y1="0" x2="1248" y2="600"/><line x1="1248" y1="0" x2="728" y2="600"/><line x1="774" y1="0" x2="1294" y2="600"/><line x1="1294" y1="0" x2="774" y2="600"/><line x1="820" y1="0" x2="1340" y2="600"/><line x1="1340" y1="0" x2="820" y2="600"/><line x1="866" y1="0" x2="1386" y2="600"/><line x1="1386" y1="0" x2="866" y2="600"/><line x1="912" y1="0" x2="1432" y2="600"/><line x1="1432" y1="0" x2="912" y2="600"/><line x1="958" y1="0" x2="1478" y2="600"/><line x1="1478" y1="0" x2="958" y2="600"/><line x1="1004" y1="0" x2="1524" y2="600"/><line x1="1524" y1="0" x2="1004" y2="600"/><line x1="1050" y1="0" x2="1570" y2="600"/><line x1="1570" y1="0" x2="1050" y2="600"/><line x1="1096" y1="0" x2="1616" y2="600"/><line x1="1616" y1="0" x2="1096" y2="600"/><line x1="1142" y1="0" x2="1662" y2="600"/><line x1="1662" y1="0" x2="1142" y2="600"/><line x1="1188" y1="0" x2="1708" y2="600"/><line x1="1708" y1="0" x2="1188" y2="600"/><line x1="1234" y1="0" x2="1754" y2="600"/><line x1="1754" y1="0" x2="1234" y2="600"/><line x1="1280" y1="0" x2="1800" y2="600"/><line x1="1800" y1="0" x2="1280" y2="600"/><line x1="1326" y1="0" x2="1846" y2="600"/><line x1="1846" y1="0" x2="1326" y2="600"/><line x1="1372" y1="0" x2="1892" y2="600"/><line x1="1892" y1="0" x2="1372" y2="600"/><line x1="1418" y1="0" x2="1938" y2="600"/><line x1="1938" y1="0" x2="1418" y2="600"/></g></svg>
    <img class="mark" src="assets/hih-mark.png" alt="">
    <img class="wordmark" src="assets/hih-wordmark.png" alt="Health Innovation Hackathon">

    <div class="t h1" data-w="777">Beyond Visions and Ideas:</div>
    <div class="t h2" data-w="483">Shaping the Future of Healthcare</div>
    <div class="t p1" data-w="530"></div>
    <div class="t p2" data-w="612">at the 7th Health Innovation Hackathon</div>
    <div class="t p3" data-w="666">Where innovation becomes the starting point</div>
    <div class="t p4" data-w="309">for what comes next.</div>

    <img class="glow" src="assets/glow.png" alt="">
    <div class="photo"></div>
    <div class="plate"><div class="name"></div><div class="role"></div></div>

    <img class="hosts" src="assets/ksau-mushkat-white.png" alt="KSAU-HS · Mushkat Incubator for Health Innovation">
    <div class="rule"></div>
  </section>
</template>

<script>
/* placeholder until a cut-out photo is supplied */
const SILHOUETTE = '<svg viewBox="0 0 432 470"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".62" stop-color="#f1ebff"/><stop offset="1" stop-color="#c9b3ff" stop-opacity=".55"/></linearGradient></defs><g fill="url(#sg)" opacity=".94"><circle cx="216" cy="130" r="123"/><path d="M4 470V350c0-60 40-96 110-96 30 34 64 50 102 50s72-16 102-50c70 0 110 36 110 96v120Z"/></g></svg>';

function render({ name, role, photo, volunteer }) {
  const node = document.getElementById("tpl").content.firstElementChild.cloneNode(true);
  node.querySelector(".p1").textContent = volunteer ? "I’m proud to volunteer on the journey" : "I’m proud to be part of the journey";
  node.querySelector(".name").textContent = name;
  node.querySelector(".role").textContent = role;
  node.querySelector(".photo").innerHTML = photo ? `<img src="${photo}" alt="">` : SILHOUETTE;
  node.id = "post-" + (name + "-" + role).toLowerCase().replace(/\W+/g, "-");
  document.body.appendChild(node);
}

/* size each text line to the width it has in the original design */
function fit() {
  document.querySelectorAll(".t[data-w]").forEach(el => {
    el.style.fontSize = "100px";
    el.style.fontSize = (100 * el.dataset.w / el.scrollWidth) + "px";
  });
}

/* ?name=…&role=…&photo=URL&volunteer=1 renders one post; otherwise the samples */
const q = new URLSearchParams(location.search);
const people = q.has("name")
  ? [{ name: q.get("name"), role: q.get("role") || "Committee Member", photo: q.get("photo"), volunteer: q.has("volunteer") }]
  : [
      { name: "Alhanouf Alhaqbani", role: "Team Deputy Leader" },
      { name: "Full Name", role: "Media Committee Member" },
      { name: "Full Name", role: "Volunteer", volunteer: true },
    ];
people.forEach(render);
document.fonts.ready.then(fit);
</script>
</body>
</html>
