<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIH7 LinkedIn Team Posts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HIH7 — LinkedIn team post, 1200 × 720 (export @2x)
   Swiss grid on the left, the HIH hexagon as a photo window on
   the right. Flat brand colours only — no glow, no streaks.
============================================================ */
:root {
  --violet: #3a12e6;   /* brochure electric violet — also the KSAU logo knock-out colour */
  --indigo: #14026a;
  --lilac: #a98bff;
  --lavender: #d9ccff;
  --white: #ffffff;
  --rule: rgba(255, 255, 255, .28);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0238; font-family: "Schibsted Grotesk", "Segoe UI", sans-serif; padding: 40px; display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; }

.post { width: 1200px; height: 720px; position: relative; overflow: hidden; background: var(--violet); color: var(--white); }

/* ---- right panel + hexagon window ---- */
.panel { position: absolute; top: 0; right: 0; bottom: 0; width: 470px; background: var(--lavender); }
.hex-frame, .hex { position: absolute; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.hex-frame { left: 670px; top: 58px; width: 520px; height: 604px; background: var(--indigo); }
.hex { left: 678px; top: 67px; width: 504px; height: 586px; background: linear-gradient(180deg, #8f6bff, #5a2ef0); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.hex img { width: 100%; height: 100%; object-fit: cover; }
.hex svg { width: 330px; height: 400px; }
/* the mark's top and bottom chevrons, set on the hexagon tips */
.chev { position: absolute; left: 870px; width: 120px; height: 34px; }
.chev.top { top: 14px; }
.chev.bot { bottom: 14px; transform: scaleY(-1); }

/* ---- left column: Swiss grid ---- */
.col { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; }
.lockup { position: absolute; top: 52px; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; }
.lockup .mark { display: flex; align-items: center; gap: 12px; }
.lockup img { width: 46px; height: 46px; filter: brightness(0) invert(1); }
.lockup .ar { font-family: "IBM Plex Sans Arabic", sans-serif; font-size: 17px; font-weight: 700; line-height: 1.1; }
.lockup .en { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--lavender); }
.lockup .ed { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--lavender); text-align: right; line-height: 1; }
.lockup .ed b { display: block; font-size: 34px; font-weight: 900; letter-spacing: -.02em; color: var(--white); margin-top: 4px; }

.label { position: absolute; top: 160px; left: 0; right: 0; font-size: 13px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--lavender); padding-top: 12px; border-top: 1px solid var(--rule); }
.name { position: absolute; top: 200px; left: 0; right: 0; font-size: 78px; font-weight: 900; line-height: .92; letter-spacing: -.035em; }
.role { position: absolute; top: 372px; left: 0; font-size: 22px; font-weight: 700; color: var(--lavender); }
.line { position: absolute; top: 414px; left: 0; width: 500px; font-size: 19px; line-height: 1.45; font-weight: 500; color: rgba(255,255,255,.88); }
.line b { color: var(--white); font-weight: 700; }

.meta { position: absolute; top: 530px; left: 0; right: 0; display: grid; grid-template-columns: 1.15fr 1.15fr .7fr; border-top: 1px solid var(--rule); }
.meta div { padding: 12px 16px 0 0; }
.meta div + div { padding-left: 16px; border-left: 1px solid var(--rule); }
.meta small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--lavender); }
.meta b { display: block; margin-top: 4px; font-size: 17px; font-weight: 700; }

.hosts { position: absolute; bottom: 40px; left: 0; display: flex; align-items: center; gap: 22px; }
.hosts .ksau { height: 40px; }
.hosts .mushkat { height: 25px; }
.hosts i { width: 1px; height: 34px; background: var(--rule); }
</style>
</head>
<body>

<template id="tpl">
  <section class="post">
    <div class="panel"></div>
    <div class="hex-frame"></div>
    <div class="hex"></div>
    <svg class="chev top" viewBox="0 0 140 40"><path d="M0 40 L70 0 L140 40 L118 40 L70 13 L22 40 Z" fill="#3a12e6"/></svg>
    <svg class="chev bot" viewBox="0 0 140 40"><path d="M0 40 L70 0 L140 40 L118 40 L70 13 L22 40 Z" fill="#3a12e6"/></svg>

    <div class="col">
      <div class="lockup">
        <div class="mark">
          <img src="../../assets/logo.png" alt="">
          <div><div class="ar">هاكاثون الابتكار الصحي</div><div class="en">Health Innovation Hackathon</div></div>
        </div>
        <div class="ed">Edition<b>07</b></div>
      </div>

      <div class="label"></div>
      <div class="name"></div>
      <div class="role"></div>
      <p class="line"></p>

      <div class="meta">
        <div><small>Dates</small><b>23–25 Jan 2027</b></div>
        <div><small>Venue</small><b>KSAU-HS, Riyadh</b></div>
        <div><small>Tracks</small><b>7</b></div>
      </div>

      <div class="hosts">
        <img class="ksau" src="../../assets/partners/ksau-white.svg" alt="KSAU-HS">
        <i></i>
        <img class="mushkat" src="../../assets/partners/mushkat-white.png" alt="Mushkat Incubator for Health Innovation">
      </div>
    </div>
  </section>
</template>

<script>
const TEAMS = {
  media: "Media", pr: "Public Relations", tech: "Technical", design: "Design",
  content: "Content", decor: "Decor", operations: "Operations",
  logistics: "Logistics", protocol: "Protocol & VIP",
};

/* placeholder until a photo is supplied */
const SILHOUETTE = '<svg viewBox="0 0 330 400"><circle cx="165" cy="150" r="78" fill="#d9ccff" opacity=".55"/><path d="M20 400c0-96 64-160 145-160s145 64 145 160Z" fill="#d9ccff" opacity=".55"/></svg>';

function render({ name, role, team, photo }) {
  const node = document.getElementById("tpl").content.firstElementChild.cloneNode(true);
  const vol = role === "Volunteer";
  node.querySelector(".label").textContent = vol ? "Volunteering at HIH7" : "Meet the organizing team";
  node.querySelector(".name").innerHTML = name.replace(" ", "<br>");
  node.querySelector(".role").textContent = team && !vol ? `${role} — ${TEAMS[team]}` : role;
  node.querySelector(".line").innerHTML = vol
    ? "Proud to volunteer at the <b>7th Health Innovation Hackathon</b> — beyond visions and ideas, shaping the future of healthcare."
    : "Proud to be part of the <b>7th Health Innovation Hackathon</b> — beyond visions and ideas, shaping the future of healthcare.";
  node.querySelector(".hex").innerHTML = photo ? `<img src="${photo}" alt="">` : SILHOUETTE;
  node.id = `post-${team || "general"}-${role.toLowerCase().replace(/\W+/g, "-")}`;
  document.body.appendChild(node);
}

/* ?name=…&role=…&team=media&photo=URL renders one post; otherwise the samples */
const q = new URLSearchParams(location.search);
const people = q.has("name")
  ? [{ name: q.get("name"), role: q.get("role") || "Committee Member", team: q.get("team") || "", photo: q.get("photo") }]
  : [
      { name: "Alhanouf Alhaqbani", role: "Deputy Team Leader", team: "" },
      { name: "Full Name", role: "Committee Member", team: "media" },
      { name: "Full Name", role: "Volunteer", team: "" },
    ];
people.forEach(render);
</script>
</body>
</html>
