<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIH7 LinkedIn Team Posts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mada:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HIH7 — LinkedIn team post, 1200 × 720 (export @2x)
   Follows the original Canva post: logo lockup top-left,
   lavender headline, framed portrait with a name plate.
   Brighter brand gradient + clean light planes instead of
   neon streaks.
============================================================ */
:root {
  --night: #12036e;
  --indigo: #1d06a8;
  --electric: #3a12e6;
  --violet: #7b4dff;
  --lilac: #b79cff;
  --lavender: #ddd0ff;
  --white: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0238; font-family: "Mada", "Segoe UI", sans-serif; padding: 40px; display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; }

.post {
  width: 1200px; height: 720px; position: relative; overflow: hidden; color: var(--white);
  background:
    radial-gradient(520px 420px at 82% 46%, rgba(183, 156, 255, .45), transparent 70%),
    radial-gradient(700px 500px at 100% 0%, rgba(214, 190, 255, .55), transparent 70%),
    linear-gradient(120deg, var(--night) 0%, var(--indigo) 38%, var(--electric) 70%, #6a3cff 100%);
}
.planes { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---- logo lockup, as in the original ---- */
.lockup { position: absolute; left: 72px; top: 52px; display: flex; flex-direction: column; align-items: flex-start; }
.lockup img { width: 84px; height: 84px; filter: brightness(0) invert(1); margin-left: 34px; }
.lockup .ar { margin-top: 14px; font-family: "IBM Plex Sans Arabic", sans-serif; font-size: 20px; font-weight: 700; direction: rtl; }
.lockup .en { font-size: 14px; font-weight: 600; letter-spacing: .04em; }

/* ---- message ---- */
.msg { position: absolute; left: 72px; top: 262px; width: 640px; }
.msg h1 { font-size: 54px; font-weight: 800; line-height: 1.02; letter-spacing: -.01em;
  background: linear-gradient(90deg, var(--lavender), var(--lilac) 70%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.msg h2 { margin-top: 10px; font-size: 27px; font-weight: 700; }
.msg p { margin-top: 22px; font-size: 22px; line-height: 1.45; font-weight: 500; color: #ece6ff; max-width: 560px; }
.msg p b { color: var(--white); font-weight: 700; }

.facts { position: absolute; left: 72px; bottom: 74px; display: flex; gap: 14px; }
.facts span { font-size: 16px; font-weight: 700; padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35); }

/* ---- portrait: arched frame + name plate ---- */
.portrait { position: absolute; right: 120px; top: 118px; width: 330px; height: 420px; }
.portrait .frame { position: absolute; inset: -14px; border-radius: 180px 180px 24px 24px; border: 1.5px solid rgba(221, 208, 255, .7); }
.portrait .photo { position: absolute; inset: 0; border-radius: 166px 166px 18px 18px; overflow: hidden;
  background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(221,208,255,.85)); display: flex; align-items: flex-end; justify-content: center; }
.portrait .photo img { width: 100%; height: 100%; object-fit: cover; }
.portrait .photo svg { width: 250px; height: 300px; }
.plate { position: absolute; left: -40px; right: -40px; bottom: -34px; background: rgba(18, 3, 110, .82); border-left: 6px solid var(--violet); padding: 14px 22px 14px 22px; }
.plate .name { font-size: 28px; font-weight: 800; line-height: 1.1; }
.plate .role { margin-top: 3px; font-size: 18px; font-weight: 600; color: var(--lavender); }

/* ---- footer rule + hosts, as in the original ---- */
.foot { position: absolute; left: 72px; right: 72px; bottom: 30px; display: flex; align-items: center; gap: 18px; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--lavender); white-space: nowrap; }
.foot::before { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.55); order: 1; }
.foot span { order: 2; }
</style>
</head>
<body>

<template id="tpl">
  <section class="post">
    <!-- light planes echoing the chevrons of the HIH7 mark -->
    <svg class="planes" viewBox="0 0 1200 720" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="690,0 900,0 1200,420 1200,620" fill="#fff" opacity=".06"/>
      <polygon points="760,720 1010,300 1080,300 860,720" fill="#fff" opacity=".07"/>
      <polygon points="0,720 0,560 520,720" fill="#fff" opacity=".04"/>
      <line x1="640" y1="720" x2="1200" y2="140" stroke="#ddd0ff" stroke-opacity=".35" stroke-width="1"/>
      <line x1="700" y1="0" x2="1200" y2="520" stroke="#ddd0ff" stroke-opacity=".22" stroke-width="1"/>
    </svg>

    <div class="lockup">
      <img src="../../assets/logo.png" alt="">
      <div class="ar">هاكاثون الابتكار الصحي</div>
      <div class="en">Health Innovation Hackathon</div>
    </div>

    <div class="msg">
      <h1>Beyond Visions and Ideas</h1>
      <h2>Shaping the Future of Healthcare</h2>
      <p></p>
    </div>

    <div class="facts"><span>23–25 January 2027</span><span>KSAU-HS, Riyadh</span></div>

    <div class="portrait">
      <div class="frame"></div>
      <div class="photo"></div>
      <div class="plate"><div class="name"></div><div class="role"></div></div>
    </div>

    <div class="foot"><span>KSAU-HS · Mushkat Incubator for Health Innovation</span></div>
  </section>
</template>

<script>
const TEAMS = {
  media: "Media", pr: "Public Relations", tech: "Technical", design: "Design",
  content: "Content", decor: "Decor", operations: "Operations",
  logistics: "Logistics", protocol: "Protocol & VIP",
};

/* placeholder silhouette until a photo is supplied */
const SILHOUETTE = '<svg viewBox="0 0 250 300"><circle cx="125" cy="100" r="66" fill="#8f6bff" opacity=".55"/><path d="M10 300c0-80 52-128 115-128s115 48 115 128Z" fill="#8f6bff" opacity=".55"/></svg>';

function message(role, team) {
  const where = "the <b>7th Health Innovation Hackathon</b>, where innovation becomes the starting point for what comes next.";
  if (role === "Volunteer") return `Proud to volunteer at ${where}`;
  return `Proud to be part of the <b>${team ? TEAMS[team] + " team" : "organizing team"}</b> at ${where}`;
}

function render({ name, role, team, photo }) {
  const node = document.getElementById("tpl").content.firstElementChild.cloneNode(true);
  node.querySelector(".msg p").innerHTML = message(role, team);
  node.querySelector(".name").textContent = name;
  node.querySelector(".role").textContent = role === "Volunteer" || !team ? role : `${role} · ${TEAMS[team]}`;
  node.querySelector(".photo").innerHTML = photo ? `<img src="${photo}" alt="">` : SILHOUETTE;
  node.id = `post-${team || "general"}-${role.toLowerCase().replace(/\W+/g, "-")}`;
  document.body.appendChild(node);
}

/* ?name=…&role=…&team=media&photo=URL renders one post; otherwise the samples */
const q = new URLSearchParams(location.search);
const people = q.has("name")
  ? [{ name: q.get("name"), role: q.get("role") || "Committee Member", team: q.get("team") || "", photo: q.get("photo") }]
  : [
      { name: "Alhanouf Alhaqbani", role: "Deputy Team Leader", team: "" },
      { name: "Full Name", role: "Committee Member", team: "media" },
      { name: "Full Name", role: "Volunteer", team: "logistics" },
    ];
people.forEach(render);
</script>
</body>
</html>
